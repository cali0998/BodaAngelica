<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Compartir Recuerdos • Yader & Angélica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream-soft: #faf6f0;
      --espresso: #3d2622;
      --espresso-soft: #593d38;
      --champagne-gold: #c29d61;
      --dusty-rose: #b5837d;
      --dusty-rose-dark: #966560;
      --eucalyptus: #7d937e;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; 
      font-family: 'Poppins', sans-serif;
      font-weight: 300;
      background-color: var(--cream-soft);
      background-image: radial-gradient(circle at center, #fdfbf8 0%, #efe5d6 100%);
      background-attachment: fixed; 
      color: var(--espresso);
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* --- ONDAS DE SEDA Y GRABADOS BOTÁNICOS DE FONDO --- */
    .bg-silk-waves {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      opacity: 0.9;
    }

    .bg-botanical-watermark {
      position: fixed;
      width: 420px;
      height: 520px;
      z-index: 2;
      pointer-events: none;
      opacity: 0.65;
    }
    .watermark-left { left: -35px; top: 5%; transform: scaleX(-1); }
    .watermark-right { right: -35px; bottom: 5%; }

    /* --- TARJETA DIFUMINADA ETÉREA SIN BORDES MARCADOS --- */
    .glass-card {
      background: transparent;
      border: none;
      padding: 56px 34px 48px 34px; 
      text-align: center; 
      max-width: 420px; 
      width: 100%;
      position: relative;
      z-index: 10;
    }

    .glass-card::before {
      content: "";
      position: absolute;
      inset: -25px -30px;
      background: radial-gradient(
        ellipse at center,
        rgba(252, 249, 244, 0.96) 0%,
        rgba(250, 246, 240, 0.90) 48%,
        rgba(247, 239, 230, 0.55) 74%,
        rgba(247, 239, 230, 0) 100%
      );
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      -webkit-mask-image: radial-gradient(ellipse at center, black 45%, transparent 80%);
      mask-image: radial-gradient(ellipse at center, black 45%, transparent 80%);
      z-index: -1;
      pointer-events: none;
    }

    .botanical-crest {
      width: 210px;
      height: 44px;
      margin: 0 auto 8px auto;
      display: block;
    }

    .rings-line-art {
      width: 190px;
      height: 44px;
      margin: 2px auto 10px auto;
      display: block;
    }

    .botanical-footer {
      width: 170px;
      height: 32px;
      margin: 18px auto 0 auto;
      display: block;
      opacity: 0.85;
    }

    h1 { 
      font-family: 'Great Vibes', cursive; 
      font-size: 48px; 
      color: var(--espresso); 
      margin: 0; 
      font-weight: 400; 
      line-height: 1.1; 
    }
    
    .date-badge { 
      font-size: 10px; 
      letter-spacing: 4px; 
      text-transform: uppercase; 
      color: var(--dusty-rose-dark); 
      font-weight: 500;
      margin-bottom: 10px; 
      display: block; 
    }

    .welcome-text { 
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 18px; 
      font-weight: 600; 
      line-height: 1.45; 
      color: var(--espresso-soft); 
      margin-bottom: 28px; 
      padding: 0 10px; 
      transition: opacity 0.3s ease;
    }
    
    .state-container { display: flex; flex-direction: column; gap: 14px; width: 100%; }
    .hidden { display: none !important; }

    /* --- BOTONES EDITORIALES SUAVES --- */
    .btn-action {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      height: 58px; border-radius: 50px; font-weight: 500; text-transform: uppercase;
      cursor: pointer; border: none; transition: all 0.3s ease;
      font-size: 11px; letter-spacing: 1.8px; width: 100%;
      font-family: 'Poppins', sans-serif;
    }

    .btn-primary { 
      background: linear-gradient(135deg, var(--dusty-rose) 0%, var(--dusty-rose-dark) 100%); 
      color: #ffffff; 
      font-weight: 500; 
      box-shadow: 0 10px 24px rgba(181, 131, 125, 0.32);
    }
    .btn-primary:active { transform: scale(0.97); }

    .btn-secondary { 
      background: rgba(255, 255, 255, 0.75); 
      color: var(--espresso); 
      box-shadow: 0 6px 18px rgba(61, 38, 34, 0.08);
    }
    .btn-secondary:active { background: rgba(181, 131, 125, 0.12); transform: scale(0.97); }

    .btn-ghost { 
      background: rgba(250, 246, 240, 0.55);
      color: var(--espresso-soft); 
      font-size: 10.5px; 
      height: 50px; 
      box-shadow: 0 4px 12px rgba(61, 38, 34, 0.05);
    }
    .btn-ghost:active { transform: scale(0.97); }

    svg { flex-shrink: 0; }

    input[type="file"] { display: none !important; }

    #preview-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px; margin-bottom: 22px; max-height: 240px; overflow-y: auto;
      padding: 12px; background: rgba(255, 255, 255, 0.55); border-radius: 22px;
      box-shadow: inset 0 2px 10px rgba(61, 38, 34, 0.06);
    }

    .preview-media { 
      width: 100%; aspect-ratio: 1/1; object-fit: cover; 
      border-radius: 12px; 
      box-shadow: 0 4px 12px rgba(61, 38, 34, 0.12); 
    }

    /* --- BARRA DE PROGRESO --- */
    #status { margin-top: 20px; width: 100%; }
    .progress-bar-bg { 
      width: 100%; height: 4px; background: rgba(181, 131, 125, 0.2); 
      margin-top: 14px; border-radius: 10px; overflow: hidden; 
    }
    .progress-bar-fill { 
      height: 100%; 
      background: linear-gradient(90deg, var(--champagne-gold), var(--dusty-rose)); 
      width: 0%; transition: width 0.4s ease; 
    }

    #statusText { 
      font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; 
      color: var(--dusty-rose-dark); font-weight: 500;
    }

    @media (max-width: 600px) {
      .bg-botanical-watermark { width: 260px; height: 340px; opacity: 0.48; }
      h1 { font-size: 42px; }
    }
  </style>
</head>
<body>

  <!-- ELEMENTOS ARTÍSTICOS DEL FONDO Y VIÑETAS -->
  <svg style="display: none;">
    <defs>
      <linearGradient id="goldSilkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#c29d61" stop-opacity="0.05"/>
        <stop offset="50%" stop-color="#c29d61" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#b5837d" stop-opacity="0.05"/>
      </linearGradient>

      <linearGradient id="roseSilkFill" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#faf6f0" stop-opacity="0"/>
        <stop offset="35%" stop-color="#e8c5c1" stop-opacity="0.32"/>
        <stop offset="70%" stop-color="#c29d61" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#faf6f0" stop-opacity="0"/>
      </linearGradient>

      <g id="silk-background-a">
        <path d="M-100,90 C320,390 680,-80 1150,230 C1320,340 1420,160 1540,250 L1540,900 L-100,900 Z" fill="url(#roseSilkFill)"/>
        <path d="M-80,150 C380,450 720,-50 1220,270 C1380,370 1460,230 1560,290" fill="none" stroke="url(#goldSilkGrad)" stroke-width="1.5"/>
        <path d="M-100,680 C380,430 880,860 1540,540" fill="none" stroke="url(#goldSilkGrad)" stroke-width="1.4"/>
      </g>

      <g id="watermark-wildrose">
        <path d="M310,510 C250,390 220,270 155,155 C120,95 85,55 45,25" fill="none" stroke="#b5837d" stroke-width="1.15" opacity="0.62"/>
        <path d="M235,340 C285,280 295,195 255,120" fill="none" stroke="#c29d61" stroke-width="0.9" opacity="0.58"/>
        <g transform="translate(155, 155)">
          <path d="M0,-38 C24,-42 44,-18 36,8 C28,32 -4,44 -26,30 C-46,16 -42,-18 -20,-32 C-6,-40 16,-32 22,-14 C28,4 12,22 -6,18 C-22,14 -24,-6 -12,-16 C-2,-24 12,-14 8,-2 C6,6 -4,8 -8,2" fill="#e8c5c1" fill-opacity="0.16" stroke="#b5837d" stroke-width="1"/>
          <circle cx="0" cy="-2" r="2" fill="#c29d61"/>
        </g>
        <path d="M195,255 C150,265 125,235 148,208 C175,212 192,235 195,255 Z" fill="#7d937e" fill-opacity="0.13" stroke="#7d937e" stroke-width="0.9"/>
        <path d="M115,105 C75,115 55,88 78,65 C102,70 112,88 115,105 Z" fill="#7d937e" fill-opacity="0.13" stroke="#7d937e" stroke-width="0.9"/>
      </g>

      <g id="watermark-eucalyptus">
        <path d="M320,520 C275,390 185,300 218,175 C240,90 180,38 125,8" fill="none" stroke="#c29d61" stroke-width="1.2" opacity="0.68"/>
        <path d="M212,245 C172,240 150,202 182,180 C214,196 222,228 212,245 Z" fill="#7d937e" fill-opacity="0.14" stroke="#7d937e" stroke-width="0.9"/>
        <path d="M222,198 C258,182 278,144 246,122 C216,144 210,176 222,198 Z" fill="#7d937e" fill-opacity="0.14" stroke="#7d937e" stroke-width="0.9"/>
        <path d="M205,132 C166,126 146,90 176,68 C205,86 212,115 205,132 Z" fill="#b5837d" fill-opacity="0.11" stroke="#b5837d" stroke-width="0.85"/>
      </g>

      <g id="crest-royal">
        <path d="M20,38 C65,38 82,18 120,18 C158,18 175,38 220,38" fill="none" stroke="#c29d61" stroke-width="0.9"/>
        <path d="M88,24 C78,14 64,16 60,24 C66,30 78,30 88,24 Z" fill="#7d937e" fill-opacity="0.2" stroke="#7d937e" stroke-width="0.8"/>
        <path d="M152,24 C162,14 176,16 180,24 C174,30 162,30 152,24 Z" fill="#7d937e" fill-opacity="0.2" stroke="#7d937e" stroke-width="0.8"/>
        <path d="M120,6 L122,14 L130,16 L122,18 L120,26 L118,18 L110,16 L118,14 Z" fill="#c29d61" opacity="0.85"/>
      </g>

      <g id="fine-rings">
        <path d="M10,28 C42,12 68,36 92,26" fill="none" stroke="#c29d61" stroke-width="0.9" stroke-linecap="round"/>
        <path d="M220,28 C188,12 162,36 138,26" fill="none" stroke="#c29d61" stroke-width="0.9" stroke-linecap="round"/>
        <path d="M48,23 C42,15 51,12 57,19 C54,22 51,23 48,23 Z" fill="#7d937e" opacity="0.55"/>
        <path d="M182,23 C188,15 179,12 173,19 C176,22 179,23 182,23 Z" fill="#7d937e" opacity="0.55"/>
        <circle cx="108" cy="26" r="11" fill="none" stroke="#c29d61" stroke-width="1.6"/>
        <circle cx="122" cy="26" r="11" fill="none" stroke="#b5837d" stroke-width="1.5"/>
      </g>

      <g id="footer-flourish">
        <path d="M25,16 C65,26 125,26 165,16" fill="none" stroke="#c29d61" stroke-width="0.8" opacity="0.75"/>
        <circle cx="95" cy="22" r="2" fill="#c29d61" opacity="0.8"/>
      </g>
    </defs>
  </svg>

  <svg class="bg-silk-waves" viewBox="0 0 1440 900" preserveAspectRatio="none"><use href="#silk-background-a"/></svg>
  <svg class="bg-botanical-watermark watermark-left" viewBox="0 0 360 520"><use href="#watermark-wildrose"/></svg>
  <svg class="bg-botanical-watermark watermark-right" viewBox="0 0 360 520"><use href="#watermark-eucalyptus"/></svg>

  <div class="glass-card">
    <svg class="botanical-crest" viewBox="0 0 240 48"><use href="#crest-royal"/></svg>
    <span class="date-badge">14 • Marzo • 2027</span>
    <h1>Yader &amp; Angélica</h1>
    <svg class="rings-line-art" viewBox="0 0 230 52"><use href="#fine-rings"/></svg>
    <p class="welcome-text" id="mainText">
      Ayúdanos a capturar cada momento de nuestra historia.
    </p>
    
    <div class="state-container" id="actions-state">
      
      <label for="cameraPhotoInput" class="btn-action btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Capturar Foto
      </label>
      <input type="file" id="cameraPhotoInput" accept="image/*" capture="environment" onchange="handleFileSelection(this.files)">
      
      <label for="cameraVideoInput" class="btn-action btn-secondary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
        Grabar Video
      </label>
      <input type="file" id="cameraVideoInput" accept="video/*" capture="environment" onchange="handleFileSelection(this.files)">
      
      <label for="fileInput" class="btn-action btn-ghost">
        Elegir de la Galería
      </label>
      <input type="file" id="fileInput" accept="image/*,video/*" multiple onchange="handleFileSelection(this.files)">
      
    </div>

    <div class="state-container hidden" id="preview-state">
      <div id="preview-grid"></div>
      <div style="display:flex; gap:10px;">
        <button class="btn-action btn-secondary" style="flex:1" onclick="cancelUpload()">Volver</button>
        <button class="btn-action btn-primary" style="flex:2" onclick="confirmAndUpload()">Enviar</button>
      </div>
    </div>
    
    <div id="status" class="hidden">
      <div id="statusText">Enviando...</div>
      <div class="progress-bar-bg"><div id="progress-fill" class="progress-bar-fill"></div></div>
    </div>

    <svg class="botanical-footer" viewBox="0 0 190 36"><use href="#footer-flourish"/></svg>
  </div>

<script>
  const cloudName = "dhruy6ftj";
  const uploadPreset = "boda_carlos_y_joss";
  const MAX_SIZE = 25 * 1024 * 1024;
  let selectedFiles = [];

  function handleFileSelection(files) {
    if (files.length === 0) return;
    const grid = document.getElementById('preview-grid');
    grid.innerHTML = '';
    selectedFiles = [];

    Array.from(files).forEach(file => {
      if (file.size > MAX_SIZE) {
        alert(`El archivo supera el límite permitido.`);
        return;
      }
      selectedFiles.push(file);
      const reader = new FileReader();
      reader.onload = (e) => {
        const el = document.createElement(file.type.startsWith('video/') ? 'video' : 'img');
        el.src = e.target.result;
        el.className = 'preview-media';
        if (file.type.startsWith('video/')) { el.muted = true; el.autoplay = true; el.loop = true; }
        grid.appendChild(el);
      };
      reader.readAsDataURL(file);
    });

    if (selectedFiles.length > 0) setVisualState('preview');
  }

  async function confirmAndUpload() {
    setVisualState('uploading');
    const statusText = document.getElementById('statusText');
    const bar = document.getElementById('progress-fill');
    
    for (let i = 0; i < selectedFiles.length; i++) {
      let progress = ((i) / selectedFiles.length) * 100;
      bar.style.width = `${progress}%`;
      statusText.innerText = `Enviando ${i+1} de ${selectedFiles.length}`;
      
      const formData = new FormData();
      formData.append('file', selectedFiles[i]);
      formData.append('upload_preset', uploadPreset);
      // Etiqueta y carpeta exclusiva para separar las fotos de Yader y Angélica en Cloudinary
      formData.append('tags', 'boda_yader_y_angelica');
      formData.append('folder', 'boda_yader_y_angelica');
      
      try {
        await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/upload`, { method: 'POST', body: formData });
      } catch (e) { 
        statusText.innerText = "Error de conexión"; 
        return; 
      }
    }
    
    bar.style.width = '100%';
    statusText.innerHTML = "<b>Recuerdos guardados</b>";
    setTimeout(cancelUpload, 3000);
  }

  function cancelUpload() {
    selectedFiles = [];
    document.getElementById('cameraPhotoInput').value = '';
    document.getElementById('cameraVideoInput').value = '';
    document.getElementById('fileInput').value = '';
    setVisualState('init');
  }

  function setVisualState(state) {
    document.getElementById('actions-state').className = (state === 'init') ? 'state-container' : 'state-container hidden';
    document.getElementById('preview-state').className = (state === 'preview') ? 'state-container' : 'state-container hidden';
    document.getElementById('status').className = (state === 'uploading') ? '' : 'hidden';
    document.getElementById('mainText').style.opacity = (state === 'init') ? '1' : '0.3';
  }
</script>
</body>
</html>
